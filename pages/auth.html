<main id="authView" class="page-view">
  <div class="auth-container">
    <div class="auth-header">
      <h2 id="authTitle" class="auth-title">Welcome Back</h2>
      <p id="authSubtitle" class="auth-subtitle">Sign in to access document upload and OCR history</p>
    </div>

    <div id="authErrorAlert" class="error-alert"></div>

    <form id="authForm" class="auth-form" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="authUsername">Username or Email</label>
        <input type="text" id="authUsername" class="form-input" placeholder="Enter your username or email" required />
      </div>

      <div id="emailGroup" class="form-group" style="display:none;">
        <label class="form-label" for="authEmail">Email Address</label>
        <input type="email" id="authEmail" class="form-input" placeholder="name@gmail.com" />
        <small style="color:var(--text-muted);font-size:12px;">Only @gmail.com email addresses can register.</small>
      </div>

      <div class="form-group">
        <label class="form-label" for="authPassword">Password</label>
        <input type="password" id="authPassword" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width:100%;margin-top:10px;">
        Sign In
      </button>
    </form>

    <!-- OTP Verification Section (hidden by default) -->
    <div id="otpSection" class="otp-section" style="display:none;">
      <div class="otp-header">
        <div class="otp-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h3 class="otp-title">Verify Your Email</h3>
        <p class="otp-subtitle">We sent a 6-digit code to <strong id="otpEmailDisplay"></strong></p>
      </div>

      <div id="otpSuccessAlert" class="otp-success-alert" style="display:none;"></div>
      <div id="otpErrorAlert" class="error-alert" style="display:none;"></div>

      <div class="otp-inputs" id="otpInputs">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" data-index="0" />
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="1" />
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="2" />
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="3" />
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="4" />
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" data-index="5" />
      </div>

      <button type="button" id="otpVerifyBtn" class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="handleOtpVerify()">
        Verify & Create Account
      </button>

      <div class="otp-resend">
        <span id="otpResendText">Didn't receive the code?</span>
        <span id="otpResendLink" class="auth-link" onclick="handleResendOtp()" style="display:none;">Resend Code</span>
        <span id="otpResendTimer" class="otp-timer"></span>
      </div>

      <div class="otp-back">
        <span class="auth-link" onclick="hideOtpSection()">← Back to registration</span>
      </div>
    </div>

    <div class="auth-divider"><span>or continue with</span></div>

    <button type="button" id="githubLoginBtn" class="btn github-btn" onclick="startGithubLogin()">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>

    <div class="auth-footer">
      <span id="authToggleText">Don't have an account?</span>
      <span id="authToggleLink" class="auth-link" onclick="toggleAuthMode()">Register</span>
    </div>
  </div>
</main>

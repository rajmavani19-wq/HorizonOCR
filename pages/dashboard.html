<main id="uploadView" class="page-view">
  <div class="hero-section" style="padding: 32px 0 16px; text-align: left;">
    <h1 class="hero-title" style="font-size:36px;margin-bottom:8px;">Dashboard</h1>
    <p class="hero-subtitle" style="margin:0;max-width:100%;">Upload documents for high-speed long-horizon OCR parsing.</p>
  </div>

  <div class="dashboard-grid">
    <!-- Main Upload Zone -->
    <div class="upload-card">
      <div id="dropzone" class="dropzone-large">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none;" />
        <div class="upload-circle">
          <i data-lucide="upload-cloud" style="width:32px;height:32px;color:#ffffff;"></i>
        </div>
        <div style="font-family:var(--font-heading);font-size:22px;font-weight:600;margin-bottom:8px;">
          Drag & Drop your document here
        </div>
        <div style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">
          Supports PDF, PNG, JPG, WEBP formats up to 50MB
        </div>
        <button class="btn btn-primary">Browse Files</button>
      </div>
    </div>
  </div>
</main>
